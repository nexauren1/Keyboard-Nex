name: Keyboard Nex Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Configure Flutter SDK and Gradle wrapper
        working-directory: android
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          printf "flutter.sdk=%s\n" "$FLUTTER_ROOT" > local.properties
          gradle wrapper --gradle-version 9.5.0

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build one optimized APK for ARM32 + ARM64
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --tree-shake-icons
          echo "APK size:"
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-nex-universal-arm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
